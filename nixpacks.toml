# Nixpacks configuration for Coolify deployment
# See: https://nixpacks.com/docs/configuration/file

[variables]
NODE_ENV = "production"
HOST = "0.0.0.0"
PORT = "3000"

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Let npm run build complete naturally - Nuxt will exit after "Build complete!"
cmds = ["npm run build"]

[start]
# HOST=0.0.0.0 ensures Nitro listens on all interfaces (required in Docker)
cmd = "npm run start"
