# Nixpacks configuration for Coolify deployment
# See: https://nixpacks.com/docs/configuration/file

[variables]
NODE_ENV = "production"
HOST = "0.0.0.0"

[phases.install]
cmds = ["npm ci"]

[phases.build]
# timeout force-kills nuxt build if it hangs after "Build complete!"
# (known issue: open handles from PWA/Firebase prevent Node.js from exiting)
# The fallback "test -d .output/server" ensures success if build output exists
cmds = ["timeout --signal=KILL 300 npm run build || test -d .output/server"]

[start]
# HOST=0.0.0.0 ensures Nitro listens on all interfaces (required in Docker)
cmd = "npm run start"
