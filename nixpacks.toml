# Nixpacks configuration for Coolify deployment
# See: https://nixpacks.com/docs/configuration/file

[variables]
NODE_ENV = "production"
HOST = "0.0.0.0"
PORT = "3000"

[phases.install]
cmds = ["npm ci"]

[phases.build]
# SIGTERM (15) instead of SIGKILL (9) allows graceful shutdown
# Nuxt build may hang due to open handles (PWA/Firebase) but still generates complete output
cmds = ["timeout --signal=TERM 300 npm run build || test -d .output/server"]

[start]
# HOST=0.0.0.0 ensures Nitro listens on all interfaces (required in Docker)
cmd = "npm run start"
