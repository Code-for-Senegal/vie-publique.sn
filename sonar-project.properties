# SonarCloud Configuration for Vie Publique Sénégal
# https://sonarcloud.io/

# Project Identification
sonar.projectKey=vie-publique-senegal_vie-publique.sn
sonar.organization=vie-publique-senegal

# Metadata
sonar.projectName=Vie Publique Sénégal
sonar.projectVersion=1.8.6

# Source Code Directories
sonar.sources=app,server

# Test Directories
sonar.tests=test

# File Exclusions
# Note: Tests are in test/ directory, already excluded via sonar.tests
sonar.exclusions=**/node_modules/**,\
  **/dist/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/coverage/**,\
  **/docs/**,\
  **/public/**,\
  **/*.md,\
  **/.github/**,\
  **/scripts/**,\

# Coverage Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source Encoding
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.language=ts,js,vue
