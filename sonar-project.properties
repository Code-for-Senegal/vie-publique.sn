# SonarCloud Configuration for Vie Publique Sénégal
# https://sonarcloud.io/

# Project Identification
sonar.projectKey=malicktech_vie-publique.sn
sonar.organization=malicktech

# Metadata
sonar.projectName=Vie Publique Sénégal
sonar.projectVersion=1.8.6

# Source Code Directories
sonar.sources=components,composables,pages,server,stores,types,utils,middleware,plugins

# Test Directories
sonar.tests=test

# File Exclusions
sonar.exclusions=**/node_modules/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/dist/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/coverage/**,\
  **/docs/**,\
  **/public/**,\
  **/*.md,\
  **/test/**,\
  **/.github/**,\
  **/scripts/**

# Coverage Reports (for future test integration)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source Encoding
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.language=ts,js,vue
